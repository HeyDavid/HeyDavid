<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="80%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#d4a14a" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#0e0e10" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stripes" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="40" height="40" fill="#ffffff"/>
      <rect width="13" height="40" fill="#b8423a"/>
      <rect x="26" width="14" height="40" fill="#2f6fb0"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0e0e10"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- barber pole -->
  <g transform="translate(120,135)">
    <rect x="0" y="0" width="58" height="360" rx="29" fill="#0a0a0c" stroke="#2c2c33" stroke-width="4"/>
    <clipPath id="poleClip"><rect x="4" y="4" width="50" height="352" rx="25"/></clipPath>
    <rect x="-30" y="4" width="120" height="352" fill="url(#stripes)" clip-path="url(#poleClip)"/>
  </g>

  <!-- wordmark -->
  <text x="250" y="250" fill="#f4efe6" font-family="Oswald, Arial Narrow, sans-serif" font-weight="700" font-size="92" letter-spacing="2" text-transform="uppercase">CORAL SPRINGS</text>
  <text x="250" y="345" fill="#d4a14a" font-family="Oswald, Arial Narrow, sans-serif" font-weight="700" font-size="92" letter-spacing="2">BARBER CO.</text>
  <rect x="252" y="385" width="120" height="5" fill="#d4a14a"/>
  <text x="392" y="408" fill="#a09a90" font-family="Oswald, Arial, sans-serif" font-size="30" letter-spacing="6">CORAL SPRINGS, FLORIDA</text>

  <text x="250" y="500" fill="#cfc9bf" font-family="Inter, Arial, sans-serif" font-size="34">Precision fades · Beard sculpting · Hot-towel shaves</text>
  <text x="250" y="552" fill="#a09a90" font-family="Inter, Arial, sans-serif" font-size="28">Walk-ins welcome · Book online in seconds</text>
</svg>
